name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run core tests
        run: swift test
      - name: Validate localization catalogs
        run: find Sources/VidradoCore/Resources -name Localizable.strings -exec plutil -lint {} +
      - name: Build and verify app
        run: ./scripts/build.sh
      - name: Validate app metadata
        run: plutil -lint Resources/Info.plist
